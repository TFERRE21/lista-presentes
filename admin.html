<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<style>

body{

font-family:Poppins,sans-serif;

background:#f7f9fc;

padding:40px;

}

.admin{

max-width:1200px;

margin:auto;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

}

h1{

text-align:center;

color:#ff5b97;

margin-bottom:30px;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:20px;

}

input{

padding:15px;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;

}

button{

padding:15px;

border:none;

border-radius:10px;

cursor:pointer;

font-size:16px;

font-weight:bold;

margin-top:10px;

}

.btnAdd{

background:#ff5b97;

color:white;

}

.btnDownload{

background:#25D366;

color:white;

margin-left:10px;

}

table{

width:100%;

border-collapse:collapse;

margin-top:30px;

}

th{

background:#ff5b97;

color:white;

padding:15px;

}

td{

padding:12px;

border-bottom:1px solid #eee;

}

tr:hover{

background:#fff3f8;

}

.btnExcluir{

background:#ff4d4d;

color:white;

padding:8px 15px;

}

.total{

margin-top:20px;

font-size:18px;

font-weight:bold;

color:#444;

}

</style>

</head>

<body>

<div class="admin">

<h1>

🎁 Painel Administrativo

</h1>

<div class="grid">

<input
type="text"
id="nome"
placeholder="Nome do convidado">

<input
type="text"
id="presente"
placeholder="Presente">

</div>

<button
class="btnAdd"
onclick="adicionar()">

➕ Adicionar Convidado

</button>

<button
class="btnDownload"
onclick="baixarJSON()">

💾 Baixar convidados.json

</button>

<div class="total">

Total de convidados:
<span id="total">

0

</span>

</div>

<table>

<thead>

<tr>

<th>

Nome

</th>

<th>

Presente

</th>

<th>

Ação

</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

</div>

<script src="admin.js"></script>

</body>

</html>
