<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Painel Administrativo

</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

<style>

body{

font-family:Poppins,sans-serif;

background:

linear-gradient(

180deg,

#ffeaf4,

#ffffff,

#e8f8ff

);

padding:40px;

}

.admin{

max-width:1400px;

margin:auto;

background:white;

padding:35px;

border-radius:25px;

box-shadow:

0 20px 50px rgba(0,0,0,.10);

}

.topo{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

flex-wrap:wrap;

}

.topo h1{

color:#ff5b97;

font-size:40px;

}

.total{

background:#ff5b97;

color:white;

padding:12px 25px;

border-radius:40px;

font-size:18px;

font-weight:bold;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

margin-bottom:20px;

}

input{

padding:16px;

border-radius:12px;

border:1px solid #ddd;

font-size:17px;

width:100%;

}

.botoes{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:20px;

}

button{

padding:15px 25px;

border:none;

border-radius:12px;

cursor:pointer;

font-size:16px;

font-weight:bold;

}

.btnAdd{

background:#ff5b97;

color:white;

}

.btnDownload{

background:#25D366;

color:white;

}

.btnCancelar{

background:#777;

color:white;

}

.btnImportar{

background:#3b82f6;

color:white;

}

</style>

</head>

<body>

<div class="admin">

<div class="topo">

<h1>

🎁 Painel Administrativo

</h1>

<div class="total">

Total:

<span id="total">

0

</span>

</div>

</div>

<input

id="pesquisa"

type="text"

placeholder="🔎 Pesquisar convidado..."

onkeyup="pesquisar()">

<br><br>

<div class="grid">

<input

id="nome"

type="text"

placeholder="Nome do convidado">

<input

id="presente"

type="text"

placeholder="Presente">

</div>

<div class="botoes">

<button

id="btnSalvar"

class="btnAdd"

onclick="adicionarOuEditar()">

➕ Adicionar Convidado

</button>

<button

class="btnCancelar"

onclick="cancelarEdicao()">

Cancelar

</button>

<button

class="btnDownload"

onclick="baixarJSON()">

💾 Baixar JSON

</button>

<label
class="btnImportar">

📥 Importar JSON

<input

type="file"

accept=".json"

style="display:none"

onchange="importarJSON(event)">

</label>

  </div>

<br>

<table>

<thead>

<tr>

<th style="width:35%">

Nome

</th>

<th style="width:35%">

Presente

</th>

<th style="width:15%">

Editar

</th>

<th style="width:15%">

Excluir

</th>

</tr>

</thead>

<tbody id="tabela">

</tbody>

</table>

<br><br>

<div
style="display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:15px;">

<div
style="
font-size:15px;
color:#666;">

💡 Dica: após editar os convidados, clique em
<strong>Baixar JSON</strong>
e substitua o arquivo
<strong>convidados.json</strong>
no GitHub.

</div>

<div
style="
font-size:15px;
color:#999;">

Chá de Fraldas da Elóa • Painel Administrativo

</div>

</div>

</div>

<script src="admin.js"></script>

</body>

</html>

<div class="acoes">

    <button onclick="adicionarOuEditar()" id="btnSalvar" class="btnAdd">

        ➕ Adicionar Convidado

    </button>

    <button onclick="cancelarEdicao()" class="btnCancelar">

        ❌ Cancelar

    </button>

    <button onclick="baixarJSON()" class="btnDownload">

        💾 Exportar JSON

    </button>

    <button onclick="totalPresentes()" class="btnImportar">

        📊 Estatísticas

    </button>

</div>
